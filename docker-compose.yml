version: '3.8'

services:
  # 1. Unified CRM Full-Stack Application (React + Express)
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://crm_user:crm_password@postgres:5432/leads_db
      # Inject other credentials/secrets from your local .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Optional persistence fallback: maps database.json into the container if running in file-database mode
      - ./database.json:/app/database.json

  # 2. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: leads_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d leads_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
